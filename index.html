<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Wide Weather App</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
</head>
<body>

    <!-- Introduction Modal -->
    <div id="introduction-modal" class="modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close introduction">&times;</button>
            <h2 id="modal-title">Welcome to the Weather App!</h2>
            <p>Enter a city name to get real-time weather details.</p>
        </div>
    </div>

    <!-- Main Container -->
    <main class="container">
        <section class="weather-card">
            <label for="city-input">Enter City Name:</label>
            <div class="input-group">
                <input type="text" id="city-input" placeholder="E.g., London, Tokyo" aria-label="City Name">
                <button id="city-input-btn">Get Weather</button>
            </div>
            <div id="error-container" aria-live="assertive"></div>

            <div id="weather-info" aria-live="polite">
                <h1 id="city-name"></h1>
                <span id="weather-icon"></span>
                <p id="temperature"></p>
                <p id="description"></p>
                <p id="wind-speed"></p>
                <p id="date"></p>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/script.js"></script>
</body>
</html>
